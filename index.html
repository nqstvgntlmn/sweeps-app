<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SWEEPS</title>
<meta name="theme-color" content="#0d0d0d">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="SWEEPS">
<link rel="manifest" href="/manifest.json">
<link rel="apple-touch-icon" href="/icon-192.png">
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #0d0d0d;
    --card: #161616;
    --border: #2a2a2a;
    --accent: #c8f135;
    --accent-dim: #9ab82a;
    --text: #f0f0f0;
    --muted: #666;
    --done-bg: #1a2200;
    --done-border: #4a6600;
    --fail-bg: #1a0a00;
    --fail-border: #5a2000;
    --fail-accent: #ff6b35;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    background: var(--bg);
    color: var(--text);
    font-family: 'DM Sans', sans-serif;
    min-height: 100vh;
    padding: 24px 16px 80px;
  }

  header { text-align: center; margin-bottom: 28px; }

  .title {
    font-family: 'Bebas Neue', sans-serif;
    font-size: clamp(52px, 12vw, 96px);
    letter-spacing: 4px;
    color: var(--accent);
    line-height: 1;
  }

  .subtitle { font-size: 13px; color: var(--muted); letter-spacing: 2px; text-transform: uppercase; margin-top: 6px; }

  /* ── Setup screen ── */
  #setupScreen {
    max-width: 440px;
    margin: 0 auto;
  }

  .setup-card {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 16px;
    padding: 28px 24px;
    margin-bottom: 16px;
  }

  .setup-title {
    font-family: 'Bebas Neue', sans-serif;
    font-size: 20px;
    letter-spacing: 2px;
    color: var(--accent);
    margin-bottom: 20px;
  }

  .field { margin-bottom: 18px; }
  .field:last-child { margin-bottom: 0; }

  .field label {
    display: block;
    font-size: 11px;
    letter-spacing: 1.5px;
    text-transform: uppercase;
    color: var(--muted);
    margin-bottom: 8px;
  }

  .field input[type="date"],
  .field input[type="number"] {
    width: 100%;
    background: var(--bg);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 10px 14px;
    color: var(--text);
    font-family: 'DM Sans', sans-serif;
    font-size: 15px;
    outline: none;
    transition: border-color 0.2s;
    -webkit-appearance: none;
    color-scheme: dark;
  }

  .field input:focus { border-color: var(--accent); }

  .field .unit {
    display: flex;
    align-items: center;
    gap: 10px;
  }

  .field .unit input { flex: 1; }
  .field .unit span { font-size: 12px; color: var(--muted); white-space: nowrap; }

  .btn-start {
    width: 100%;
    background: var(--accent);
    color: #000;
    border: none;
    border-radius: 12px;
    padding: 16px;
    font-family: 'Bebas Neue', sans-serif;
    font-size: 22px;
    letter-spacing: 3px;
    cursor: pointer;
    transition: opacity 0.2s;
    margin-top: 8px;
  }

  .btn-start:hover { opacity: 0.85; }

  /* ── Main tracker ── */
  #trackerScreen { display: none; }

  .top-bar {
    max-width: 480px;
    margin: 0 auto 16px;
    display: flex;
    justify-content: flex-end;
    gap: 10px;
  }

  .icon-btn {
    background: var(--card);
    border: 1px solid var(--border);
    color: var(--muted);
    border-radius: 8px;
    padding: 7px 12px;
    font-size: 12px;
    letter-spacing: 1px;
    text-transform: uppercase;
    cursor: pointer;
    transition: border-color 0.2s, color 0.2s;
    font-family: 'DM Sans', sans-serif;
  }

  .icon-btn:hover { border-color: var(--accent); color: var(--accent); }

  .stats-row {
    max-width: 480px;
    margin: 0 auto 24px;
    display: grid;
    grid-template-columns: 1fr 1fr 1fr;
    gap: 10px;
  }

  .stat-box {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 14px 12px;
    text-align: center;
  }

  .stat-num {
    font-family: 'Bebas Neue', sans-serif;
    font-size: 32px;
    line-height: 1;
  }

  .stat-num.green { color: var(--accent); }
  .stat-num.orange { color: var(--fail-accent); }
  .stat-num.white { color: var(--text); }

  .stat-label { font-size: 10px; color: var(--muted); letter-spacing: 1.5px; text-transform: uppercase; margin-top: 4px; }

  .day-nav {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 16px;
    margin-bottom: 20px;
  }

  .day-nav button {
    background: var(--card);
    border: 1px solid var(--border);
    color: var(--text);
    width: 36px; height: 36px;
    border-radius: 50%;
    font-size: 18px;
    cursor: pointer;
    display: flex; align-items: center; justify-content: center;
    transition: border-color 0.15s, color 0.15s;
  }

  .day-nav button:hover { border-color: var(--accent); color: var(--accent); }
  .day-nav button:disabled { opacity: 0.2; cursor: default; }

  .day-label {
    font-family: 'Bebas Neue', sans-serif;
    font-size: 28px;
    letter-spacing: 2px;
    min-width: 160px;
    text-align: center;
  }

  .day-label span {
    display: block;
    font-family: 'DM Sans', sans-serif;
    font-size: 11px;
    letter-spacing: 2px;
    color: var(--muted);
    text-transform: uppercase;
    margin-top: 2px;
  }

  .day-label .penalty-tag {
    display: inline-block;
    background: var(--fail-accent);
    color: #000;
    font-family: 'DM Sans', sans-serif;
    font-size: 10px;
    font-weight: 700;
    letter-spacing: 1px;
    padding: 2px 7px;
    border-radius: 20px;
    text-transform: uppercase;
    margin-top: 4px;
  }

  .day-strip {
    max-width: 480px;
    margin: 0 auto 24px;
    display: flex;
    gap: 5px;
    overflow-x: auto;
    padding-bottom: 4px;
    scrollbar-width: none;
  }

  .day-strip::-webkit-scrollbar { display: none; }

  .day-pip { flex-shrink: 0; width: 26px; display: flex; flex-direction: column; align-items: center; gap: 4px; cursor: pointer; }
  .day-pip-num { font-size: 9px; color: var(--muted); font-weight: 500; }
  .day-pip-dot { width: 8px; height: 8px; border-radius: 50%; background: var(--border); transition: background 0.2s; }
  .day-pip.active .day-pip-num { color: var(--accent); }
  .day-pip.active .day-pip-dot { background: var(--accent); }
  .day-pip.complete .day-pip-dot { background: var(--accent-dim); }
  .day-pip.failed .day-pip-dot { background: var(--fail-accent); }
  .day-pip.penalty .day-pip-dot { background: #333; border: 1px solid var(--fail-accent); }
  .day-pip.penalty .day-pip-num { color: var(--fail-accent); }
  .day-pip.future { opacity: 0.3; cursor: default; }

  .habits {
    max-width: 480px;
    margin: 0 auto;
    display: flex;
    flex-direction: column;
    gap: 10px;
  }

  .habit-card {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 16px 18px;
    display: flex;
    align-items: center;
    gap: 16px;
    cursor: pointer;
    transition: border-color 0.2s, background 0.2s, transform 0.1s;
    user-select: none;
    -webkit-tap-highlight-color: transparent;
  }

  .habit-card:active { transform: scale(0.985); }
  .habit-card.done { background: var(--done-bg); border-color: var(--done-border); }
  .habit-card.done .letter { color: var(--accent); border-color: var(--accent); }
  .habit-card.done .habit-name { color: var(--accent-dim); text-decoration: line-through; text-decoration-color: #4a6600; }
  .habit-card.done .habit-desc { color: #3a5200; }
  .habit-card.locked { opacity: 0.4; cursor: default; }

  .letter {
    font-family: 'Bebas Neue', sans-serif;
    font-size: 28px;
    color: var(--muted);
    border: 1px solid var(--border);
    border-radius: 8px;
    width: 44px; height: 44px;
    display: flex; align-items: center; justify-content: center;
    flex-shrink: 0;
    transition: color 0.2s, border-color 0.2s;
  }

  .habit-info { flex: 1; }
  .habit-name { font-size: 15px; font-weight: 500; letter-spacing: 0.3px; }
  .habit-desc { font-size: 12px; color: var(--muted); margin-top: 2px; }

  .check {
    width: 24px; height: 24px;
    border: 1.5px solid var(--border);
    border-radius: 50%;
    flex-shrink: 0;
    display: flex; align-items: center; justify-content: center;
    transition: border-color 0.2s, background 0.2s;
  }

  .habit-card.done .check { border-color: var(--accent); background: var(--accent); }
  .check svg { display: none; }
  .habit-card.done .check svg { display: block; }

  .exercise-row {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 16px 18px;
    transition: border-color 0.2s, background 0.2s;
  }

  .exercise-row.week-done { background: var(--done-bg); border-color: var(--done-border); }
  .exercise-row.week-failed { border-color: var(--fail-border); }

  .exercise-top { display: flex; align-items: center; gap: 16px; margin-bottom: 14px; }
  .workout-dots { display: flex; gap: 10px; padding-left: 60px; }

  .dot {
    width: 38px; height: 38px;
    border-radius: 8px;
    border: 1.5px solid var(--border);
    background: transparent;
    cursor: pointer;
    display: flex; align-items: center; justify-content: center;
    font-size: 11px;
    color: var(--muted);
    font-family: 'DM Sans', sans-serif;
    font-weight: 500;
    transition: border-color 0.2s, background 0.2s, color 0.2s;
    -webkit-tap-highlight-color: transparent;
  }

  .dot.lit { border-color: var(--accent); background: var(--accent); color: #000; }

  /* Week failure banner */
  .week-fail-banner {
    max-width: 480px;
    margin: 0 auto 10px;
    background: var(--fail-bg);
    border: 1px solid var(--fail-border);
    border-radius: 10px;
    padding: 10px 16px;
    font-size: 12px;
    color: var(--fail-accent);
    letter-spacing: 0.5px;
    display: none;
  }

  /* Share modal */
  .modal-overlay {
    display: none;
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.8);
    z-index: 200;
    align-items: center;
    justify-content: center;
    padding: 20px;
  }

  .modal-overlay.open { display: flex; }

  .modal {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 16px;
    padding: 28px 24px;
    width: 100%;
    max-width: 400px;
  }

  .modal-title {
    font-family: 'Bebas Neue', sans-serif;
    font-size: 22px;
    letter-spacing: 2px;
    color: var(--accent);
    margin-bottom: 16px;
  }

  .modal p { font-size: 13px; color: var(--muted); margin-bottom: 16px; line-height: 1.6; }

  .url-box {
    background: var(--bg);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 10px 14px;
    font-size: 12px;
    color: var(--muted);
    word-break: break-all;
    margin-bottom: 16px;
    font-family: monospace;
  }

  .modal-btns { display: flex; gap: 10px; }

  .btn-copy {
    flex: 1;
    background: var(--accent);
    color: #000;
    border: none;
    border-radius: 10px;
    padding: 12px;
    font-family: 'Bebas Neue', sans-serif;
    font-size: 18px;
    letter-spacing: 2px;
    cursor: pointer;
  }

  .btn-close {
    background: transparent;
    color: var(--muted);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 12px 16px;
    font-family: 'DM Sans', sans-serif;
    font-size: 13px;
    cursor: pointer;
  }

  /* Penalty day overlay */
  .penalty-overlay {
    background: var(--fail-bg);
    border: 1px solid var(--fail-border);
    border-radius: 12px;
    padding: 20px;
    text-align: center;
    max-width: 480px;
    margin: 0 auto;
  }

  .penalty-overlay .po-icon { font-size: 32px; margin-bottom: 8px; }
  .penalty-overlay .po-title { font-family: 'Bebas Neue', sans-serif; font-size: 24px; letter-spacing: 2px; color: var(--fail-accent); }
  .penalty-overlay .po-sub { font-size: 13px; color: var(--muted); margin-top: 6px; line-height: 1.5; }

  /* ── Owala bubbles (admin only) ── */
  .owala-row {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 16px 18px;
    transition: border-color 0.2s, background 0.2s;
  }

  .owala-row.all-done {
    background: var(--done-bg);
    border-color: var(--done-border);
  }

  .owala-top { display: flex; align-items: center; gap: 16px; margin-bottom: 14px; }

  .owala-bubbles {
    display: flex;
    gap: 10px;
    padding-left: 60px;
  }

  .owala-bubble {
    width: 44px; height: 44px;
    border-radius: 50%;
    border: 2px solid var(--border);
    background: transparent;
    cursor: pointer;
    display: flex; align-items: center; justify-content: center;
    font-size: 18px;
    transition: border-color 0.2s, background 0.2s, transform 0.1s;
    -webkit-tap-highlight-color: transparent;
    position: relative;
    overflow: hidden;
  }

  .owala-bubble:active { transform: scale(0.9); }

  .owala-bubble.filled {
    border-color: #4aa8ff;
    background: #0a3a6e;
  }

  .owala-bubble.filled::after {
    content: '';
    position: absolute;
    bottom: 0; left: 0; right: 0;
    height: 100%;
    background: linear-gradient(to top, #1a6abf 0%, #4aa8ff 100%);
    border-radius: 50%;
    animation: fillUp 0.3s ease-out;
  }

  @keyframes fillUp {
    from { height: 0; }
    to { height: 100%; }
  }

  .owala-bubble .drop { position: relative; z-index: 1; font-size: 16px; }

  .confetti { position: fixed; top: 0; left: 0; right: 0; bottom: 0; pointer-events: none; z-index: 100; overflow: hidden; }

  .confetti-piece {
    position: absolute;
    width: 8px; height: 8px;
    opacity: 0;
    animation: fall 1.2s ease-in forwards;
  }

  @keyframes fall {
    0% { transform: translateY(-20px) rotate(0deg); opacity: 1; }
    100% { transform: translateY(100vh) rotate(720deg); opacity: 0; }
  }
</style>
</head>
<body>

<header>
  <div class="title">SWEEPS</div>
  <div class="subtitle" id="mainSubtitle">75 Medium Challenge</div>
</header>

<!-- SETUP SCREEN -->
<div id="setupScreen">
  <div class="setup-card">
    <div class="setup-title">Your Goals</div>

    <div class="field">
      <label>Start Date</label>
      <input type="date" id="startDate" />
    </div>

    <div class="field">
      <label>Water Goal</label>
      <div class="unit">
        <input type="number" id="goalWater" value="128" min="1" max="256" />
        <span>oz / day</span>
      </div>
    </div>

    <div class="field">
      <label>Steps Goal</label>
      <div class="unit">
        <input type="number" id="goalSteps" value="10000" min="1000" max="50000" step="500" />
        <span>steps / day</span>
      </div>
    </div>

    <div class="field">
      <label>Pages Goal</label>
      <div class="unit">
        <input type="number" id="goalPages" value="10" min="1" max="100" />
        <span>pages / day</span>
      </div>
    </div>

    <div class="field">
      <label>Workouts per Week</label>
      <div class="unit">
        <input type="number" id="goalWorkouts" value="4" min="1" max="7" />
        <span>workouts / week</span>
      </div>
    </div>
  </div>

  <button class="btn-start" onclick="startChallenge()">START SWEEPS</button>
</div>

<!-- TRACKER SCREEN -->
<div id="trackerScreen">
  <div class="top-bar">
    <button class="icon-btn" onclick="openShare()">⬆ Share</button>
    <button class="icon-btn" onclick="resetToSetup()">⚙ Settings</button>
  </div>

  <div class="stats-row">
    <div class="stat-box">
      <div class="stat-num green" id="statDay">1</div>
      <div class="stat-label">Current Day</div>
    </div>
    <div class="stat-box">
      <div class="stat-num white" id="statGoal">75</div>
      <div class="stat-label">Goal Days</div>
    </div>
    <div class="stat-box">
      <div class="stat-num orange" id="statPenalty">0</div>
      <div class="stat-label">Penalty Days</div>
    </div>
  </div>

  <div class="day-nav">
    <button id="prevBtn">‹</button>
    <div class="day-label" id="dayLabel">DAY 1<span></span></div>
    <button id="nextBtn">›</button>
  </div>


  <div class="day-strip" id="dayStrip"></div>

  <div class="week-fail-banner" id="weekFailBanner"></div>

  <div class="habits" id="habitsContainer"></div>
</div>

<!-- Share Progress Modal -->
<div class="modal-overlay" id="shareModal">
  <div class="modal">
    <div class="modal-title">Share Progress</div>
    <canvas id="shareCanvas" style="width:100%;border-radius:10px;margin-bottom:16px;"></canvas>
    <div class="modal-btns">
      <button class="btn-copy" id="shareImgBtn" onclick="shareImage()">SHARE IMAGE</button>
      <button class="btn-close" onclick="closeShare()">Close</button>
    </div>
    <div style="margin-top:12px;padding-top:12px;border-top:1px solid var(--border);">
      <div style="font-size:11px;color:var(--muted);letter-spacing:1.5px;text-transform:uppercase;margin-bottom:8px;">Invite a Friend</div>
      <div class="url-box" id="shareUrl" style="margin-bottom:8px;font-size:11px;"></div>
      <button class="btn-close" style="width:100%;text-align:center;" onclick="copyUrl()">Copy Invite Link</button>
    </div>
  </div>
</div>

<div class="confetti" id="confetti"></div>

<script>
// ── Constants ──────────────────────────────────────────────
const BASE_DAYS = 75;
const STORAGE_KEY = 'sweeps_v2';

// ── State ──────────────────────────────────────────────────
let cfg = null;   // { startDate, goalWater, goalSteps, goalPages, goalWorkouts }
let data = {};    // day/week check data
let currentDay = 1;

// ── Persistence ────────────────────────────────────────────
function loadStore() {
  try { return JSON.parse(localStorage.getItem(STORAGE_KEY)) || {}; } catch { return {}; }
}
function saveStore() {
  localStorage.setItem(STORAGE_KEY, JSON.stringify({ cfg, data }));
}

// ── URL param helpers ──────────────────────────────────────
// Share URL only encodes the blank template config (no progress data)
function buildShareUrl() {
  const base = location.href.split('?')[0].split('#')[0];
  const params = new URLSearchParams({
    sw: 1,  // sweeps flag
    // no start date — recipient sets their own
    w: cfg.goalWater,
    s: cfg.goalSteps,
    p: cfg.goalPages,
    wk: cfg.goalWorkouts,
  });
  return `${base}?${params.toString()}`;
}

function readUrlParams() {
  const p = new URLSearchParams(location.search);
  if (!p.get('sw')) return null;
  return {
    goalWater: parseInt(p.get('w')) || 128,
    goalSteps: parseInt(p.get('s')) || 10000,
    goalPages: parseInt(p.get('p')) || 10,
    goalWorkouts: parseInt(p.get('wk')) || 4,
  };
}

// ── Date helpers ───────────────────────────────────────────
function parseDate(str) {
  const [y,m,d] = str.split('-').map(Number);
  return new Date(y, m-1, d);
}

function formatDate(n) {
  const d = new Date(parseDate(cfg.startDate));
  d.setDate(d.getDate() + n - 1);
  return d.toLocaleDateString('en-US', { weekday: 'short', month: 'short', day: 'numeric' });
}

function getTodayDayNum() {
  const now = new Date(); now.setHours(0,0,0,0);
  const start = parseDate(cfg.startDate); start.setHours(0,0,0,0);
  return Math.max(1, Math.floor((now - start) / 86400000) + 1);
}

function getWeekNum(n) { return Math.ceil(n / 7); }

// ── Data accessors ─────────────────────────────────────────
function getDayChecks(n) { return data[`day_${n}`] || {}; }
function setDayCheck(n, id, val) {
  if (!data[`day_${n}`]) data[`day_${n}`] = {};
  data[`day_${n}`][id] = val;
  saveStore();
}
function getWeekWorkouts(w) { return data[`week_${w}`] || 0; }
function setWeekWorkouts(w, c) { data[`week_${w}`] = c; saveStore(); }

// ── Penalty logic ──────────────────────────────────────────
// A past day fails if ANY daily habit is unchecked
function isDayFailed(n) {
  const checks = getDayChecks(n);
  return ['stretch','water','eat','pages','steps'].some(id => !checks[id]);
}

// A past week fails if workouts < goal (evaluated at end of each 7-day week)
function isWeekFailed(w) {
  return getWeekWorkouts(w) < cfg.goalWorkouts;
}

// Calculate total penalty days accrued so far (only for days/weeks in the past)
function calcPenaltyDays(todayNum) {
  let penalty = 0;
  // Daily habit failures for days 1..todayNum-1 (yesterday and before)
  for (let d = 1; d < todayNum; d++) {
    if (isDayFailed(d)) penalty += 2;
  }
  // Weekly exercise failures: only count completed weeks
  const completedWeeks = Math.floor((todayNum - 1) / 7);
  for (let w = 1; w <= completedWeeks; w++) {
    if (isWeekFailed(w)) penalty += 2;
  }
  return penalty;
}

function getTotalGoal(todayNum) {
  return BASE_DAYS + calcPenaltyDays(todayNum);
}

// Is this day a "penalty extension" day (beyond original 75)?
function isPenaltyDay(n) { return n > BASE_DAYS; }

// ── Day complete check (for strip coloring) ────────────────
function isDayComplete(n) {
  return !isDayFailed(n);
}

// ── Setup ──────────────────────────────────────────────────
function startChallenge() {
  const startDateVal = document.getElementById('startDate').value;
  if (!startDateVal) { alert('Please pick a start date.'); return; }

  const newCfg = {
    startDate: startDateVal,
    goalWater: parseInt(document.getElementById('goalWater').value) || 128,
    goalSteps: parseInt(document.getElementById('goalSteps').value) || 10000,
    goalPages: parseInt(document.getElementById('goalPages').value) || 10,
    goalWorkouts: parseInt(document.getElementById('goalWorkouts').value) || 4,
  };

  // Only wipe progress if this is a brand new challenge (no existing data)
  // Returning from Settings preserves all progress
  const isNewChallenge = !cfg;
  cfg = newCfg;
  if (isNewChallenge) data = {};

  saveStore();
  showTracker();
}

function resetToSetup() {
  if (!confirm('Go back to settings? Your progress will be kept.')) return;
  showSetup();
}

function showSetup() {
  document.getElementById('setupScreen').style.display = 'block';
  document.getElementById('trackerScreen').style.display = 'none';
  if (cfg) {
    document.getElementById('startDate').value = cfg.startDate;
    document.getElementById('goalWater').value = cfg.goalWater;
    document.getElementById('goalSteps').value = cfg.goalSteps;
    document.getElementById('goalPages').value = cfg.goalPages;
    document.getElementById('goalWorkouts').value = cfg.goalWorkouts;
  }
}

function showTracker() {
  document.getElementById('setupScreen').style.display = 'none';
  document.getElementById('trackerScreen').style.display = 'block';
  currentDay = Math.min(getTodayDayNum(), getTotalGoal(getTodayDayNum()));
  render();
}

// ── Render ─────────────────────────────────────────────────
function render() {
  const todayNum = getTodayDayNum();
  const penalty = calcPenaltyDays(todayNum);
  const totalGoal = BASE_DAYS + penalty;
  const checks = getDayChecks(currentDay);
  const weekNum = getWeekNum(currentDay);
  const workouts = getWeekWorkouts(weekNum);
  const isFuture = currentDay > todayNum;
  const isPenalty = isPenaltyDay(currentDay);
  const exDone = workouts >= cfg.goalWorkouts;

  // Subtitle
  document.getElementById('mainSubtitle').textContent =
    `Started ${new Date(parseDate(cfg.startDate)).toLocaleDateString('en-US',{month:'short',day:'numeric',year:'numeric'})}`;

  // Stats
  document.getElementById('statDay').textContent = Math.min(todayNum, totalGoal);
  document.getElementById('statGoal').textContent = totalGoal;
  document.getElementById('statPenalty').textContent = penalty;

  // Day label
  const penaltyTag = isPenalty ? `<div class="penalty-tag">+2 Penalty Day</div>` : '';
  document.getElementById('dayLabel').innerHTML =
    `DAY ${currentDay}<span>${formatDate(currentDay)}</span>${penaltyTag}`;

  // Nav
  document.getElementById('prevBtn').disabled = currentDay <= 1;
  document.getElementById('nextBtn').disabled = currentDay >= Math.min(todayNum, totalGoal);

  // Day strip — show all days up to totalGoal
  const strip = document.getElementById('dayStrip');
  strip.innerHTML = '';
  for (let d = 1; d <= totalGoal; d++) {
    const pip = document.createElement('div');
    const past = d < todayNum;
    const isActive = d === currentDay;
    const isFut = d > todayNum;
    const isPen = d > BASE_DAYS;
    let cls = 'day-pip';
    if (isActive) cls += ' active';
    else if (isPen && isFut) cls += ' penalty future';
    else if (isPen) cls += ' penalty';
    else if (isFut) cls += ' future';
    else if (past && isDayComplete(d)) cls += ' complete';
    else if (past) cls += ' failed';
    pip.className = cls;
    pip.innerHTML = `<div class="day-pip-num">${d}</div><div class="day-pip-dot"></div>`;
    if (!isFut || isPen) pip.onclick = () => { if (d <= Math.min(todayNum, totalGoal)) { currentDay = d; render(); } };
    strip.appendChild(pip);
    if (isActive) setTimeout(() => pip.scrollIntoView({ inline: 'center', behavior: 'smooth' }), 50);
  }

  // Week fail banner (for the current week if it's over)
  const banner = document.getElementById('weekFailBanner');
  const currentWeekComplete = (currentDay % 7 === 0); // last day of week
  const prevWeekNum = getWeekNum(currentDay - 1);
  const showBanner = currentDay > 1 && (currentDay % 7 === 1) && isWeekFailed(prevWeekNum);
  if (showBanner) {
    banner.style.display = 'block';
    banner.textContent = `⚠ Week ${prevWeekNum} ended with only ${getWeekWorkouts(prevWeekNum)}/${cfg.goalWorkouts} workouts — +2 penalty days added.`;
  } else {
    banner.style.display = 'none';
  }

  // Habits container
  const container = document.getElementById('habitsContainer');
  container.innerHTML = '';

  // If it's a future penalty day, show placeholder
  if (isFuture && isPenalty) {
    const po = document.createElement('div');
    po.className = 'penalty-overlay';
    po.innerHTML = `
      <div class="po-icon">🔒</div>
      <div class="po-title">Penalty Day ${currentDay}</div>
      <div class="po-sub">This day was added because of a missed habit.<br>Keep going — you've got this.</div>`;
    container.appendChild(po);
    return;
  }

  // S — Stretch
  container.appendChild(makeHabitCard(
    { id:'stretch', letter:'S', name:'Stretch', desc:'Once daily' },
    !!checks.stretch, isFuture
  ));

  // W — Water (Owala bubbles if admin, regular checkbox otherwise)
  if (isAdmin()) {
    const OWALA_COUNT = 5;
    const owalaFilled = getDayChecks(currentDay).owala || 0;
    const allDone = owalaFilled >= OWALA_COUNT;

    const owalaCard = document.createElement('div');
    owalaCard.className = 'owala-row' + (allDone ? ' all-done' : '');
    owalaCard.innerHTML = `
      <div class="owala-top">
        <div class="letter" id="wLetter" style="${allDone ? 'color:var(--accent);border-color:var(--accent)' : ''};cursor:pointer;">W</div>
        <div class="habit-info">
          <div class="habit-name" style="${allDone ? 'color:var(--accent-dim);text-decoration:line-through;text-decoration-color:#4a6600' : ''}">Water</div>
          <div class="habit-desc" style="${allDone ? 'color:#3a5200' : ''}">${owalaFilled}/${OWALA_COUNT} Owalas · ${owalaFilled * 30}/${OWALA_COUNT * 30} oz</div>
        </div>
      </div>
      <div class="owala-bubbles" id="OwalasBubbles"></div>`;
    container.appendChild(owalaCard);

    document.getElementById('wLetter').addEventListener('click', handleWTripleTap);

    if (!isFuture) setDayCheck(currentDay, 'water', allDone);

    const bubblesContainer = document.getElementById('OwalasBubbles');
    for (let i = 1; i <= OWALA_COUNT; i++) {
      const bubble = document.createElement('div');
      bubble.className = 'owala-bubble' + (i <= owalaFilled ? ' filled' : '');
      bubble.innerHTML = `<span class="drop">💧</span>`;
      if (!isFuture) {
        bubble.onclick = () => {
          const cur = getDayChecks(currentDay).owala || 0;
          const next = i <= cur ? i - 1 : i;
          if (!data[`day_${currentDay}`]) data[`day_${currentDay}`] = {};
          data[`day_${currentDay}`].owala = next;
          data[`day_${currentDay}`].water = next >= OWALA_COUNT;
          saveStore();
          if (next > cur) maybeConfetti();
          render();
        };
      }
      bubblesContainer.appendChild(bubble);
    }
  } else {
    // Non-admin: regular water card with triple-tap W to unlock Owala mode
    const regularCard = makeHabitCard(
      { id:'water', letter:'W', name:'Water', desc:`${cfg.goalWater} oz / day` },
      !!checks.water, isFuture
    );
    // Attach triple-tap to the W letter box
    regularCard.querySelector('.letter').addEventListener('click', handleWTripleTap);
    container.appendChild(regularCard);
  }

  // E — Eat
  container.appendChild(makeHabitCard(
    { id:'eat', letter:'E', name:'Eat', desc:'Calorie deficit' },
    !!checks.eat, isFuture
  ));

  // E — Exercise (weekly)
  const exCard = document.createElement('div');
  exCard.className = 'exercise-row' + (exDone ? ' week-done' : '');
  exCard.innerHTML = `
    <div class="exercise-top">
      <div class="letter" style="${exDone ? 'color:var(--accent);border-color:var(--accent)' : ''}">E</div>
      <div class="habit-info">
        <div class="habit-name" style="${exDone ? 'color:var(--accent-dim)' : ''}">Exercise</div>
        <div class="habit-desc" style="${exDone ? 'color:#3a5200' : ''}">${cfg.goalWorkouts} workouts this week · Week ${weekNum}</div>
      </div>
    </div>
    <div class="workout-dots" id="workoutDots"></div>`;
  container.appendChild(exCard);

  for (let i = 1; i <= cfg.goalWorkouts; i++) {
    const dot = document.createElement('div');
    dot.className = 'dot' + (i <= workouts ? ' lit' : '');
    dot.textContent = i;
    if (!isFuture) {
      dot.onclick = () => {
        const cur = getWeekWorkouts(weekNum);
        const next = i <= cur ? i - 1 : i;
        setWeekWorkouts(weekNum, next);
        if (next > cur) maybeConfetti();
        render();
      };
    }
    document.getElementById('workoutDots').appendChild(dot);
  }

  // P — Pages
  container.appendChild(makeHabitCard(
    { id:'pages', letter:'P', name:'Pages', desc:`${cfg.goalPages} pages / day` },
    !!checks.pages, isFuture
  ));

  // S — Steps
  container.appendChild(makeHabitCard(
    { id:'steps', letter:'S', name:'Steps', desc:`${cfg.goalSteps.toLocaleString()} steps / day` },
    !!checks.steps, isFuture
  ));
}

function makeHabitCard(h, checked, isFuture) {
  const card = document.createElement('div');
  card.className = 'habit-card' + (checked ? ' done' : '') + (isFuture ? ' locked' : '');
  card.innerHTML = `
    <div class="letter">${h.letter}</div>
    <div class="habit-info">
      <div class="habit-name">${h.name}</div>
      <div class="habit-desc">${h.desc}</div>
    </div>
    <div class="check">
      <svg width="12" height="10" viewBox="0 0 12 10" fill="none">
        <path d="M1 5L4.5 8.5L11 1" stroke="#000" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
      </svg>
    </div>`;
  if (!isFuture) {
    card.onclick = () => {
      const prev = !!getDayChecks(currentDay)[h.id];
      setDayCheck(currentDay, h.id, !prev);
      if (!prev) maybeConfetti();
      render();
    };
  }
  return card;
}

// ── Share Progress Image ───────────────────────────────────
function openShare() {
  document.getElementById('shareUrl').textContent = buildShareUrl();
  document.getElementById('shareModal').classList.add('open');
  // Draw after modal is visible so canvas dimensions are correct
  setTimeout(drawShareCard, 50);
}

function closeShare() {
  document.getElementById('shareModal').classList.remove('open');
}

function copyUrl() {
  navigator.clipboard.writeText(buildShareUrl()).then(() => {
    const btn = document.querySelector('#shareModal .btn-close:last-child');
    const orig = btn.textContent;
    btn.textContent = 'Copied!';
    setTimeout(() => btn.textContent = orig, 2000);
  });
}

function drawShareCard() {
  const canvas = document.getElementById('shareCanvas');
  const W = 600, H = 400;
  canvas.width = W; canvas.height = H;
  const ctx = canvas.getContext('2d');

  const todayNum = getTodayDayNum();
  const penalty = calcPenaltyDays(todayNum);
  const totalGoal = BASE_DAYS + penalty;
  const checks = getDayChecks(todayNum);
  const weekNum = getWeekNum(todayNum);
  const workouts = getWeekWorkouts(weekNum);

  // Count completed/failed days
  let completedDays = 0, failedDays = 0;
  for (let d = 1; d < todayNum; d++) {
    if (!isDayFailed(d)) completedDays++; else failedDays++;
  }

  // Background gradient
  const bg = ctx.createLinearGradient(0, 0, W, H);
  bg.addColorStop(0, '#0d0d0d'); bg.addColorStop(1, '#141a00');
  ctx.fillStyle = bg;
  rrect(ctx, 0, 0, W, H, 16); ctx.fill();
  ctx.strokeStyle = '#2a2a2a'; ctx.lineWidth = 1;
  rrect(ctx, 0.5, 0.5, W-1, H-1, 16); ctx.stroke();

  // Title
  ctx.fillStyle = '#c8f135';
  ctx.font = '52px "Bebas Neue", serif';
  ctx.fillText('SWEEPS', 32, 68);
  ctx.fillStyle = '#555';
  ctx.font = '500 12px "DM Sans", sans-serif';
  ctx.fillText(`75 MEDIUM · STARTED ${new Date(parseDate(cfg.startDate)).toLocaleDateString('en-US',{month:'short',day:'numeric',year:'numeric'}).toUpperCase()}`, 34, 90);

  // Day badge
  const bx = W-140, by = 24, bw = 116, bh = 64;
  ctx.fillStyle = '#1a2200'; ctx.strokeStyle = '#4a6600'; ctx.lineWidth = 1;
  rrect(ctx, bx, by, bw, bh, 12); ctx.fill(); ctx.stroke();
  ctx.fillStyle = '#c8f135'; ctx.font = '42px "Bebas Neue", serif';
  ctx.textAlign = 'center';
  ctx.fillText(`DAY ${todayNum}`, bx+bw/2, by+44);
  ctx.fillStyle = '#555'; ctx.font = '500 10px "DM Sans", sans-serif';
  ctx.fillText(`OF ${totalGoal}`, bx+bw/2, by+58);
  ctx.textAlign = 'left';

  // Stats row
  [['COMPLETED', completedDays, '#c8f135'], ['FAILED', failedDays, '#ff6b35'], ['PENALTY', penalty, '#ff6b35']].forEach(([label, val, color], i) => {
    const sx = 32 + i*120, sy = 112, sw = 108, sh = 64;
    ctx.fillStyle = '#161616'; ctx.strokeStyle = '#2a2a2a'; ctx.lineWidth = 1;
    rrect(ctx, sx, sy, sw, sh, 10); ctx.fill(); ctx.stroke();
    ctx.fillStyle = color; ctx.font = '32px "Bebas Neue", serif';
    ctx.fillText(val, sx+14, sy+38);
    ctx.fillStyle = '#555'; ctx.font = '500 9px "DM Sans", sans-serif';
    ctx.fillText(label, sx+14, sy+54);
  });

  // Today label
  ctx.fillStyle = '#555'; ctx.font = '500 10px "DM Sans", sans-serif';
  ctx.fillText(`TODAY · ${formatDate(todayNum).toUpperCase()}`, 32, 208);

  // Habits
  const habits = [
    { letter:'S', name:'Stretch', done:!!checks.stretch },
    { letter:'W', name:'Water',   done:!!checks.water },
    { letter:'E', name:'Eat',     done:!!checks.eat },
    { letter:'E', name:'Exercise',done:workouts>=cfg.goalWorkouts, weekly:true, workouts, goal:cfg.goalWorkouts },
    { letter:'P', name:'Pages',   done:!!checks.pages },
    { letter:'S', name:'Steps',   done:!!checks.steps },
  ];

  habits.forEach((h, i) => {
    const col = i < 3 ? 0 : 1;
    const row = i < 3 ? i : i - 3;
    const hx = 32 + col*284, hy = 220 + row*46, hw = 270, hh = 38;

    ctx.fillStyle = h.done ? '#1a2200' : '#161616';
    ctx.strokeStyle = h.done ? '#4a6600' : '#2a2a2a'; ctx.lineWidth = 1;
    rrect(ctx, hx, hy, hw, hh, 8); ctx.fill(); ctx.stroke();

    // Letter box
    ctx.fillStyle = h.done ? '#1e2800' : '#1a1a1a';
    ctx.strokeStyle = h.done ? '#c8f135' : '#333'; ctx.lineWidth = 1;
    rrect(ctx, hx+6, hy+5, 28, 28, 5); ctx.fill(); ctx.stroke();
    ctx.fillStyle = h.done ? '#c8f135' : '#555';
    ctx.font = '18px "Bebas Neue", serif';
    ctx.textAlign = 'center';
    ctx.fillText(h.letter, hx+20, hy+24);
    ctx.textAlign = 'left';

    // Name
    ctx.fillStyle = h.done ? '#9ab82a' : '#ccc';
    ctx.font = `${h.done?'500':'400'} 13px "DM Sans", sans-serif`;
    ctx.fillText(h.name, hx+42, hy+21);
    if (h.done) {
      const tw = ctx.measureText(h.name).width;
      ctx.strokeStyle = '#4a6600'; ctx.lineWidth = 1.5;
      ctx.beginPath(); ctx.moveTo(hx+42, hy+15); ctx.lineTo(hx+42+tw, hy+15); ctx.stroke();
    }

    // Exercise dots on right side
    if (h.weekly) {
      for (let d = 1; d <= h.goal; d++) {
        const dx = hx + hw - 14 - (h.goal - d) * 14;
        ctx.fillStyle = d <= h.workouts ? '#c8f135' : '#2a2a2a';
        ctx.strokeStyle = d <= h.workouts ? '#9ab82a' : '#3a3a3a'; ctx.lineWidth = 1;
        ctx.beginPath(); ctx.arc(dx, hy+hh/2, 5, 0, Math.PI*2); ctx.fill(); ctx.stroke();
      }
    } else {
      // Check circle
      const cx2 = hx+hw-18, cy2 = hy+hh/2;
      ctx.strokeStyle = h.done ? '#c8f135' : '#333'; ctx.lineWidth = 1.5;
      ctx.beginPath(); ctx.arc(cx2, cy2, 9, 0, Math.PI*2);
      if (h.done) { ctx.fillStyle = '#c8f135'; ctx.fill(); }
      ctx.stroke();
      if (h.done) {
        ctx.strokeStyle = '#000'; ctx.lineWidth = 2;
        ctx.beginPath(); ctx.moveTo(cx2-4,cy2); ctx.lineTo(cx2-1,cy2+3); ctx.lineTo(cx2+4,cy2-3); ctx.stroke();
      }
    }
  });

  // Progress dot strip
  const stripY = 366, dotSize = 6, dotGap = 2, startX = 32;
  ctx.fillStyle = '#555'; ctx.font = '500 9px "DM Sans", sans-serif';
  ctx.fillText('PROGRESS', startX, stripY - 6);
  for (let d = 1; d <= Math.min(totalGoal, 75); d++) {
    const dx = startX + (d-1)*(dotSize+dotGap), dy = stripY;
    if (d === todayNum) ctx.fillStyle = '#c8f135';
    else if (d < todayNum && !isDayFailed(d)) ctx.fillStyle = '#9ab82a';
    else if (d < todayNum) ctx.fillStyle = '#ff6b35';
    else ctx.fillStyle = '#2a2a2a';
    ctx.beginPath(); ctx.arc(dx+dotSize/2, dy+dotSize/2, dotSize/2, 0, Math.PI*2); ctx.fill();
  }

  // Watermark
  ctx.fillStyle = '#333'; ctx.font = '400 11px "DM Sans", sans-serif';
  ctx.textAlign = 'right';
  ctx.fillText(location.hostname, W-32, H-16);
  ctx.textAlign = 'left';
}

function rrect(ctx, x, y, w, h, r) {
  ctx.beginPath();
  ctx.moveTo(x+r,y); ctx.lineTo(x+w-r,y); ctx.quadraticCurveTo(x+w,y,x+w,y+r);
  ctx.lineTo(x+w,y+h-r); ctx.quadraticCurveTo(x+w,y+h,x+w-r,y+h);
  ctx.lineTo(x+r,y+h); ctx.quadraticCurveTo(x,y+h,x,y+h-r);
  ctx.lineTo(x,y+r); ctx.quadraticCurveTo(x,y,x+r,y); ctx.closePath();
}

async function shareImage() {
  const canvas = document.getElementById('shareCanvas');
  const btn = document.getElementById('shareImgBtn');
  try {
    canvas.toBlob(async (blob) => {
      const file = new File([blob], 'sweeps-progress.png', { type: 'image/png' });
      if (navigator.share && navigator.canShare({ files: [file] })) {
        await navigator.share({ files: [file], title: 'SWEEPS Progress' });
      } else {
        // Fallback: download the image
        const a = document.createElement('a');
        a.href = URL.createObjectURL(blob);
        a.download = 'sweeps-progress.png';
        a.click();
      }
    }, 'image/png');
  } catch (e) {
    console.error('Share failed:', e);
  }
}

// ── Confetti ───────────────────────────────────────────────
function maybeConfetti() {
  const colors = ['#c8f135','#fff','#9ab82a','#e0ff80'];
  const el = document.getElementById('confetti');
  el.innerHTML = '';
  for (let i = 0; i < 30; i++) {
    const p = document.createElement('div');
    p.className = 'confetti-piece';
    p.style.cssText = `left:${Math.random()*100}%;top:${Math.random()*-10}%;background:${colors[Math.floor(Math.random()*colors.length)]};border-radius:${Math.random()>.5?'50%':'2px'};animation-delay:${Math.random()*.4}s;animation-duration:${.8+Math.random()*.6}s;`;
    el.appendChild(p);
  }
  setTimeout(() => el.innerHTML = '', 1500);
}

// ── Nav buttons ────────────────────────────────────────────
document.getElementById('prevBtn').onclick = () => { if (currentDay > 1) { currentDay--; render(); } };
document.getElementById('nextBtn').onclick = () => {
  const todayNum = getTodayDayNum();
  const totalGoal = getTotalGoal(todayNum);
  if (currentDay < Math.min(todayNum, totalGoal)) { currentDay++; render(); }
};

// ── Owala mode — activated by tapping W letter 3 times ────
const ADMIN_KEY = 'sweeps_admin';
let wTapCount = 0, wTapTimer = null;

function checkAdmin() {
  return localStorage.getItem(ADMIN_KEY) === '1';
}

function handleWTripleTap() {
  wTapCount++;
  clearTimeout(wTapTimer);
  if (wTapCount >= 3) {
    wTapCount = 0;
    const current = localStorage.getItem(ADMIN_KEY) === '1';
    localStorage.setItem(ADMIN_KEY, current ? '0' : '1');
    render(); // re-render to show/hide bubbles
  } else {
    wTapTimer = setTimeout(() => { wTapCount = 0; }, 600);
  }
}

const isAdmin = checkAdmin;

// ── Boot ───────────────────────────────────────────────────
(function init() {
  // Check URL params first (shared link)
  const urlParams = readUrlParams();
  const stored = loadStore();

  // Default start date to today
  const today = new Date();
  const todayStr = today.toISOString().split('T')[0];
  document.getElementById('startDate').value = todayStr;

  if (urlParams) {
    // Coming from a shared link — pre-fill goals but force setup
    document.getElementById('goalWater').value = urlParams.goalWater;
    document.getElementById('goalSteps').value = urlParams.goalSteps;
    document.getElementById('goalPages').value = urlParams.goalPages;
    document.getElementById('goalWorkouts').value = urlParams.goalWorkouts;
    // If they also have stored data, load it; otherwise fresh
    if (stored.cfg) {
      cfg = stored.cfg; data = stored.data || {};
      showTracker();
    } else {
      showSetup();
    }
  } else if (stored.cfg) {
    // Returning user
    cfg = stored.cfg; data = stored.data || {};
    showTracker();
  } else {
    showSetup();
  }
})();
</script>
